services:
  - type: web
    name: classbot
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: npm ci
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Europe/Moscow
      - key: CLEANUP_DAYS
        value: "14"
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MODERATOR_IDS
        sync: false
      - key: SITE_URL
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true

  - type: cron
    name: classbot-cleanup
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    schedule: "0 0 * * *"
    buildCommand: npm ci
    startCommand: node scripts/cleanup-homework.js
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TZ
        value: Europe/Moscow
      - key: CLEANUP_DAYS
        value: "14"
      - key: MONGO_URI
        sync: false
