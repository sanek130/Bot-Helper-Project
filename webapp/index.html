<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ДЗник</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/app/app.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div>
        <p class="brand">ДЗник</p>
        <h1 id="greeting">Загрузка…</h1>
        <p class="meta" id="meta"></p>
      </div>
    </header>

    <nav class="tabs" id="tabs" hidden>
      <button type="button" data-tab="week" class="active">Неделя</button>
      <button type="button" data-tab="search">Поиск</button>
      <button type="button" data-tab="schedule">Расписание</button>
      <button type="button" data-tab="admin" id="tab-admin" hidden>Админ</button>
    </nav>

    <main id="main">
      <p class="status" id="status">Открой приложение из Telegram-бота.</p>
    </main>
  </div>
  <script src="/app/app.js"></script>
</body>
</html>
