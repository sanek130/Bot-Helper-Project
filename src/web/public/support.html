<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поддержка — HW-Helper</title>
<meta name="description" content="HW-Helper: домашние задания и расписание твоего класса.">
<link rel="stylesheet" href="/styles.css">
<script src="/bot-config.js"></script>
</head>
<body data-page="support">
<header class="site-header">
  <div class="container">
    <a class="brand" href="/">HW-Helper</a>
    <nav class="nav" aria-label="Основное меню">
      <a href="/app" data-nav-user class="hidden">Кабинет</a>
      <a href="/admin" data-nav-role="admin" class="hidden">Админ</a>
      <a href="/creator" data-nav-role="creator,moderator" class="hidden">Панель</a>
      <a href="/news">Новости</a>
      <a href="/support" data-nav-user class="hidden">Поддержка</a>
      <a href="/help">Помощь</a>
      <a href="/login" data-nav-guest>Войти</a>
    </nav>
  </div>
</header>
<main>
<div class="container">
<h1>Поддержка</h1>
<div id="support-alert" role="status"></div>
<div class="card">
  <h2>Написать в поддержку</h2>
  <form id="support-form" class="stack" novalidate>
    <div class="field">
      <label for="support-text">Опиши проблему</label>
      <textarea id="support-text" maxlength="2000" required></textarea>
    </div>
    <button type="submit">Отправить</button>
  </form>
</div>
<section class="card">
  <h2>Мои обращения</h2>
  <div id="my-tickets"><p class="muted">Загрузка...</p></div>
</section>
<section class="card hidden" id="staff-block">
  <h2>Открытые тикеты</h2>
  <div id="open-tickets"></div>
</section>
</div>
</main>
<footer class="site-footer">
  <div class="container">
    <a href="/help">Помощь</a>
    <a href="/privacy">Политика</a>
    <a href="https://t.me/{{BOT_USERNAME}}?start=support" target="_blank" rel="noopener">Контакт создателя</a>
    <span class="muted">© {{YEAR}} HW-Helper</span>
  </div>
</footer>
<script type="module" src="/support.js"></script>
</body>
</html>
