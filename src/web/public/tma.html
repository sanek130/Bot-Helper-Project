<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HW-Helper</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/tma.css">
<script src="/bot-config.js" defer></script>
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<script type="module" src="/tma.js"></script>
</head>
<body>
<main class="tma" id="tma">
  <header class="tma-head">
    <div>
      <h1>HW-Helper</h1>
      <p class="tma-sub" id="tma-class">Загрузка…</p>
    </div>
    <a class="tma-link" id="tma-full" href="/app">Полная версия</a>
  </header>

  <nav class="tma-tabs hidden" id="tma-tabs" aria-label="Дни">
    <button type="button" data-tab="0">Сегодня</button>
    <button type="button" data-tab="1" class="active">Завтра</button>
    <button type="button" data-tab="2">Послезавтра</button>
    <button type="button" data-tab="schedule">Расписание</button>
  </nav>

  <section id="tma-content" aria-live="polite">
    <div class="tma-skeleton"></div>
    <div class="tma-skeleton"></div>
    <div class="tma-skeleton short"></div>
  </section>
</main>
</body>
</html>
